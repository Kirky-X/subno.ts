# Dependabot 依赖更新（GitHub 原生）。
# npm 依赖 + GitHub Actions 版本自动升级 PR。
version: 2
updates:
  # 1) GitHub Actions 版本
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, github-actions]
    commit-message:
      prefix: 'ci(deps)'
      include: scope

  # 2) npm 依赖（主项目根目录）
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies, npm]
    commit-message:
      prefix: 'chore(deps)'
      include: scope
    groups:
      # 类型定义打包升级，减少 PR 噪音
      types:
        patterns: ['@types/*']
      # typescript-eslint 一起升级
      typescript-eslint:
        patterns: ['@typescript-eslint/*', 'typescript-eslint']
      # vitest 相关一起升级
      vitest:
        patterns: ['vitest', '@vitest/*']
    ignore:
      # Next.js major 升级需人工评估（破坏性变更多）
      - dependency-name: 'next'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']

  # 3) npm 依赖（TypeScript SDK）
  - package-ecosystem: npm
    directory: /sdk/typescript
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, npm, sdk]
    commit-message:
      prefix: 'chore(deps)'
      include: scope
