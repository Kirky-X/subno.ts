# CodeQL 静态安全分析（GitHub 原生，跨语言自动检测）。
# 触发: push 到主分支 / PR / 每周二定时全量扫描
# 无需额外 secret：使用自动注入的 GITHUB_TOKEN。
name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '37 4 * * 2' # 每周二 04:37 UTC（避开整点）

permissions:
  contents: read
  security-events: write # 上传 SARIF 到 Security 标签页

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v7

      # 显式指定语言，避免 CodeQL 误检测 Java/C++（原生依赖中含 .java 文件）
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          config: |
            paths-ignore:
              - node_modules
              - .next
              - dist
              - sdk
              - coverage

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'
