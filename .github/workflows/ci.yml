name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npx tsc --noEmit

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage -- --run

      - name: Enforce coverage threshold (≥95%)
        run: |
          node -e "
          const fs = require('fs');
          const cov = JSON.parse(fs.readFileSync('./coverage/coverage-summary.json','utf8'));
          const t = cov.total;
          const fmt = (n) => n.toFixed(2) + '%';
          const lines = t.lines.pct, branches = t.branches.pct, fn = t.functions.pct, stmt = t.statements.pct;
          console.log('Lines: ' + fmt(lines));
          console.log('Branches: ' + fmt(branches));
          console.log('Functions: ' + fmt(fn));
          console.log('Statements: ' + fmt(stmt));
          const THRESHOLD = 95;
          const failed = [lines, branches, fn, stmt].filter(x => x < THRESHOLD);
          if (failed.length > 0) {
            console.error('❌ 覆盖率低于 ' + THRESHOLD + '% 门禁');
            process.exit(1);
          }
          console.log('✅ 覆盖率达标');
          "

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # 构建时需要 dummy 值避免 env 验证失败（API 路由在收集页面数据时被求值）
          ADMIN_MASTER_KEY: ci-build-placeholder-key-32-chars-min!!
          CRON_SECRET: ci-build-placeholder-cron-secret-32-chars!
          # cron 路由在 page-data 收集阶段会触发 DB/Redis 客户端初始化，需要 dummy URL
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci_dummy?sslmode=disable
          REDIS_URL: redis://127.0.0.1:6379

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: |
            .next
            .env.example
          retention-days: 1

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (production deps only)
        run: npm audit --omit=dev --audit-level=high
