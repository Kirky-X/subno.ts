name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: []
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm run test:coverage -- --run

      - name: Install Vercel CLI
        run: npm install --no-save vercel@latest

      - name: Pull Vercel Environment
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Vercel
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          DEPLOY_URL=$(npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "Deployed to: $DEPLOY_URL"

      - name: Smoke test deployed endpoints
        run: |
          BASE_URL="${{ steps.deploy.outputs.url }}"
          echo "Testing endpoints on $BASE_URL"

          echo "=== Health Check ==="
          curl -sf -o /dev/null -w "HTTP %{http_code}\n" "$BASE_URL/api/health" || exit 1

          echo "=== Readiness Check ==="
          curl -sf -o /dev/null -w "HTTP %{http_code}\n" "$BASE_URL/api/ready" || exit 1

          echo "=== API Docs ==="
          curl -sf -o /dev/null -w "HTTP %{http_code}\n" "$BASE_URL/api-docs" || exit 1

          echo "=== Missing API Key (should 401) ==="
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$BASE_URL/api/register" -H "Content-Type: application/json" -d '{}')
          if [ "$CODE" != "401" ]; then
            echo "Expected 401, got $CODE"
            exit 1
          fi
          echo "HTTP $CODE (expected 401)"

          echo "✅ All smoke tests passed"
