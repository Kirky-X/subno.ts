name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-test:
    name: Vercel Auto-Deploy Smoke Test
    runs-on: ubuntu-latest
    # Vercel Git Integration 已连接 Kirky-X/subno.ts → subno-ts 项目
    # push to main 时 Vercel 自动触发部署，本 Job 仅负责部署后冒烟测试
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for Vercel auto-deploy to complete
        run: |
          echo "等待 Vercel Git Integration 完成自动部署..."
          # Vercel 通常在 30-60s 内完成构建，预留 90s 等待窗口
          sleep 90
          echo "等待完成，开始冒烟测试"

      - name: Smoke test production endpoints
        run: |
          BASE_URL="https://subno-ts.vercel.app"
          echo "Testing endpoints on $BASE_URL"
          FAIL=0

          echo "=== 1. Health Check (期望 200) ==="
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$BASE_URL/api/health")
          echo "HTTP $CODE"
          [ "$CODE" = "200" ] || { echo "❌ Health check failed"; FAIL=1; }

          echo "=== 2. Readiness Check (期望 200 或 503) ==="
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$BASE_URL/api/ready")
          echo "HTTP $CODE"
          { [ "$CODE" = "200" ] || [ "$CODE" = "503" ]; } || { echo "❌ Ready check failed"; FAIL=1; }

          echo "=== 3. API Docs (期望 200) ==="
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$BASE_URL/api-docs")
          echo "HTTP $CODE"
          [ "$CODE" = "200" ] || { echo "❌ API docs failed"; FAIL=1; }

          echo "=== 4. Root Page (期望 200) ==="
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$BASE_URL/")
          echo "HTTP $CODE"
          [ "$CODE" = "200" ] || { echo "❌ Root page failed"; FAIL=1; }

          echo "=== 5. Register 无 API Key (期望 401) ==="
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 -X POST "$BASE_URL/api/register" -H "Content-Type: application/json" -d '{}')
          echo "HTTP $CODE"
          [ "$CODE" = "401" ] || { echo "❌ Register auth failed"; FAIL=1; }

          echo "=== 6. Channels 无 API Key (期望 401) ==="
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$BASE_URL/api/channels")
          echo "HTTP $CODE"
          [ "$CODE" = "401" ] || { echo "❌ Channels auth failed"; FAIL=1; }

          echo "=== 7. Publish 无 API Key (期望 401) ==="
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 -X POST "$BASE_URL/api/publish" -H "Content-Type: application/json" -d '{"channelId":"test","message":"hi"}')
          echo "HTTP $CODE"
          [ "$CODE" = "401" ] || { echo "❌ Publish auth failed"; FAIL=1; }

          echo "=== 8. Subscribe 无 API Key (期望 401) ==="
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$BASE_URL/api/subscribe?channelId=test")
          echo "HTTP $CODE"
          [ "$CODE" = "401" ] || { echo "❌ Subscribe auth failed"; FAIL=1; }

          echo "=== 9. Keys DELETE 无 API Key (期望 401) ==="
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 -X DELETE "$BASE_URL/api/keys/00000000-0000-0000-0000-000000000000")
          echo "HTTP $CODE"
          [ "$CODE" = "401" ] || { echo "❌ Keys auth failed"; FAIL=1; }

          echo "=== 10. Revoke 无 API Key (期望 401) ==="
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 -X POST "$BASE_URL/api/keys/00000000-0000-0000-0000-000000000000/revoke" -H "Content-Type: application/json" -d '{"reason":"test"}')
          echo "HTTP $CODE"
          [ "$CODE" = "401" ] || { echo "❌ Revoke auth failed"; FAIL=1; }

          echo ""
          if [ "$FAIL" = "0" ]; then
            echo "✅ All smoke tests passed (10/10)"
          else
            echo "❌ Smoke tests failed"
            exit 1
          fi
